[workspace]
resolver = "2"
members = ["crates/dockside", "crates/dockside-hook"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Optimized but quick to rebuild, for day-to-day use: `build.bat` (no args).
# `build.bat release` still makes the fully optimized, smaller exe.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
