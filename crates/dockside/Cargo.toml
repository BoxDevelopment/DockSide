[package]
name = "dockside"
description = "A macOS-style desktop shell (menu bar, Dock, ...) for Windows 11"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
chrono = "0.4"
# World Clock widget time zones.
chrono-tz = "0.10"
notify = "6"
serde = { version = "1", features = ["derive"] }
# Claude Code hook events and its settings.json (key order kept when editing).
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"
# Needed by windows-rs `#[implement]` (Finder drop target).
windows-core = "0.58"
winvd = "0.0.49"
# Deflate for the shelf's Zip Quick Action (raw streams; the zip container is our own).
miniz_oxide = "0.8"

[dependencies.windows]
version = "0.58"
features = [
    "implement",
    "ApplicationModel_Appointments",
    "Devices_Enumeration",
    # Control Center: Wi-Fi / Bluetooth radios, network scans, Mobile Hotspot.
    "Devices_Radios",
    "Devices_WiFi",
    "Networking_Connectivity",
    "Networking_NetworkOperators",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_Imaging",
    "Graphics_DirectX_Direct3D11",
    "Media_Control",
    "Media_MediaProperties",
    "Media_Ocr",
    "Media_Transcoding",
    "Storage",
    "Storage_Streams",
    "System",
    "UI",
    "UI_Notifications",
    "Web",
    "Web_Http",
    "Web_Http_Headers",
    "UI_Notifications_Management",
    "UI_Composition",
    "UI_Composition_Desktop",
    # GPU temperature for the System widget (D3DKMT adapter perf data).
    "Wdk_Graphics_Direct3D",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_Storage_Xps",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Devices_Display",
    # The Battery menu: health and charge rate straight from the battery driver.
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_IO",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    # Video widget: decoding with the Source Reader.
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    # Pinned MSIX apps follow their package across updates.
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    # Stack samples of busy threads (cpu_watch).
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    # Parent processes, to keep games started by anti-cheat launchers hook-free.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemServices",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3.0.12"
