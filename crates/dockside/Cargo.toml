[package]
name = "dockside"
description = "A macOS-style desktop shell (menu bar, Dock, ...) for Windows 11"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
chrono = "0.4"
# World Clock widget time zones.
chrono-tz = "0.10"
notify = "6"
serde = { version = "1", features = ["derive"] }
# Claude Code hook events and its settings.json (key order kept when editing).
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"
# Needed by windows-rs `#[implement]` (Finder drop target).
windows-core = "0.58"
winvd = "0.0.49"

[dependencies.windows]
version = "0.58"
features = [
    "implement",
    "ApplicationModel_Appointments",
    "Devices_Enumeration",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Media_Control",
    "Media_MediaProperties",
    "Media_Transcoding",
    "Storage",
    "Storage_Streams",
    "System",
    "UI",
    "UI_Notifications",
    "Web",
    "Web_Http",
    "Web_Http_Headers",
    "UI_Notifications_Management",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
