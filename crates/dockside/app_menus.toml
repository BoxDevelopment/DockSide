# Mac-style menus for apps whose own menus DockSide can't read (Electron and
# Chromium apps, browsers, ...). Apps with a readable menu bar show their own.
#
# To change one, copy its [[app]] block into %APPDATA%\DockSide\app_menus.toml
# and edit it there: an app listed there replaces the one here. An app's name
# menu and the Window menu are DockSide's own and always shown.
#
# Each [[app.menu]] is one title. Its items are:
#   { name = "Save", keys = "Ctrl+S" }   sends that shortcut to the app
#   { name = "Library", open = "steam://open/games" }   opens a link or path
#   { name = "Zoom", items = [ ... ] }   a submenu (written on one line)
#   "-"                                   a separator

