# DockSide configuration.
# Changes apply as soon as you save this file. Delete it to restore defaults.

[general]
# "auto" follows the Windows app theme, or force "light" / "dark".
appearance = "auto"
# UI font. Install "SF Pro Text" (or "Inter") for the most faithful look;
# falls back to "Segoe UI Variable Text" when the font isn't installed.
font = "SF Pro Text"
# Highlight color for menus and selections.
accent = "#007AFF"
# Hide the Windows taskbar while DockSide runs (always restored on exit).
hide_taskbar = true
# "mac" shows ⌘C-style hints in menus (⌘ = Ctrl, ⌥ = Alt, ⌃ = Win),
# "windows" shows Ctrl+C.
shortcut_style = "mac"
# "glass" backgrounds (and the glass Finder sidebar) bend and magnify what's
# behind them like Apple's Liquid Glass. This captures the screen, so glass
# surfaces are hidden from screenshots and screen sharing; turn it off to keep
# a non-bending glass that shows up in captures.
glass_refraction = true
# Set once the Setup Assistant has been finished or skipped. Set it back to
# false to see it on the next launch (or open it from System Settings > General).
onboarding_done = false
# Screenshot Mode: personal details (your name and picture, location, weather,
# calendar, notifications, Wi-Fi and Bluetooth names, what's playing) are
# swapped for demo data so screenshots are safe to share.
screenshot_mode = false

[windows]
# How app windows minimize into their Dock icon: "genie" or "scale" like
# macOS, "classic" (the original genie: the window funnels down row by row),
# or "windows" for Windows' own animation.
minimize_effect = "genie"
# Windows restored from the Dock come back out of their icon.
animate_restore = true
# How windows appear the first time and how they close: "genie" (out of and
# into their Dock icon), "shatter" (they break into shards), "fragments" (a
# few big pieces) or "windows" for Windows' own.
open_effect = "genie"
close_effect = "genie"
# "slow", "normal" or "fast".
speed = "normal"
# Programs the animation hook must never be loaded into: their windows keep
# Windows' own animations. Exe names ("Discord.exe", "obs*") or paths
# ('D:\Games\*' or "D:/Games/*"), case-insensitive, with * and ? wildcards. Games and
# launchers protected by BattlEye, EasyAntiCheat, Vanguard, FACEIT, ESEA,
# Ricochet, GameGuard or XIGNCODE (and anything installed next to them) are
# always left alone, whatever is listed here.
no_inject = []

[menubar]
enabled = true
# Bar height in points (22-40); text and icons scale with it.
height = 24
# "clear" (no bar, like macOS Tahoe: text sits on the wallpaper and turns
# light or dark to match it), "acrylic", "blur", "glass" (Liquid Glass) or "none"
backdrop = "clear"
tint_light = "#F4F4F4B0"
tint_dark = "#1C1C1EB0"
# "apple", "windows", or a path to a .png / .ico
logo = "apple"
# strftime syntax, see https://docs.rs/chrono/latest/chrono/format/strftime
clock_format = "%a %b %-d  %-I:%M %p"
show_battery = true
show_battery_percent = false
show_wifi = true
show_search = true
show_control_center = true
# Lists every app's tray icon (left click = click it, right click = its menu).
show_tray = true
# App name shown when the desktop has focus.
desktop_app_name = "Finder"
# Keep maximized windows from covering the menu bar.
reserve_space = true
# With more than one display: "all" puts a menu bar on each (dimmed on the
# displays without the focused window, like macOS), "main" only on the main one.
displays = "all"

[control_center]
# The controls Control Center shows (Settings > Control Center).
wifi = true
bluetooth = true
nearby_sharing = true
now_playing = true
focus = true
project = true
cast = true
display = true
sound = true
dark_mode = true
calculator = true
timer = true
screenshot = true
airplane_mode = true
energy_saver = true
night_light = true
hotspot = true
live_captions = true
accessibility = true
keyboard = false
vpn = false

[dock]
enabled = true
tile_size = 48
magnification = true
magnified_size = 80
# Gap between the Dock and the bottom of the screen (Settings: Vertical offset).
bottom_margin = 4
# Gap between Dock items, as a percentage of the icon size (Settings: Item spacing).
item_spacing = 8
backdrop = "acrylic"
tint_light = "#F6F6F680"
tint_dark = "#2A2A2C80"
# "native" draws Windows icons as-is; "squircle" puts them on a white macOS-style tile.
icon_style = "native"
# Show running apps that aren't pinned.
show_running = true
show_trash = true
# Custom Trash icons (.png / .ico) for when it's empty and when it's full; "" uses
# the Recycle Bin's own. Right-click the Trash > Change Icon… sets the current one.
trash_icon = ""
trash_icon_full = ""
# A soft drop shadow under the Dock.
shadow = true
# A thin outline around the Dock's edge.
border = true
# Optional macOSicons.com API key: adds Mac-style results to the Dock's
# Change Icon… picker (each search uses one of the key's monthly requests).
macosicons_key = ""
# Slide the Dock off-screen until the pointer touches the bottom edge.
autohide = false
# With autohide, keep the Dock shown while the desktop is focused.
show_on_desktop = false
# Keep maximized windows from covering the Dock (ignored with autohide).
reserve_space = true
# With more than one display: "main" keeps the Dock on the main display, "all"
# puts one on each, and "follow" moves it to whichever display you rest the
# pointer on the bottom edge of (like macOS).
displays = "main"
# With a Dock on each display: show only the running apps with windows on that display.
per_display_apps = false

# Pinned apps, left to right.
#   path  - .exe, .lnk, folder, URI, "shell:AppsFolder\<AUMID>" for Store apps,
#           "dockside:finder" for the built-in Finder, or "dockside:start" for
#           a Windows logo that opens the Start menu
#   name  - tooltip label (optional)
#   args  - launch arguments (optional)
#   icon  - custom .png / .ico, e.g. a macOS-style icon (optional)
#   match - exe file name used to detect the running app (optional)
# Environment variables like %LOCALAPPDATA% are expanded.

[[dock.apps]]
name = "Start"
path = "dockside:start"

[[dock.apps]]
name = "Finder"
path = "dockside:finder"

[[dock.apps]]
name = "Launchpad"
path = "dockside:launchpad"

[[dock.apps]]
name = "Microsoft Edge"
path = "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe"

[[dock.apps]]
name = "Terminal"
path = "shell:AppsFolder\\Microsoft.WindowsTerminal_8wekyb3d8bbwe!App"
match = "WindowsTerminal.exe"

[[dock.apps]]
name = "Notepad"
path = "C:\\Windows\\System32\\notepad.exe"

[[dock.apps]]
name = "Calculator"
path = "shell:AppsFolder\\Microsoft.WindowsCalculator_8wekyb3d8bbwe!App"
match = "CalculatorApp.exe"

[[dock.apps]]
name = "System Settings"
path = "shell:AppsFolder\\windows.immersivecontrolpanel_cw5n1h2txyewy!microsoft.windows.immersivecontrolpanel"
match = "SystemSettings.exe"

[spotlight]
enabled = true
# Global shortcut: any of ctrl/alt/shift/win + a key ("alt+space", "ctrl+shift+k", "win+f1"),
# or one of those modifiers tapped on its own ("win", "ctrl"). With "win", double-tap Win for Start.
# Set it in System Settings > General by clicking the shortcut and pressing the keys.
hotkey = "alt+space"
# The panel's material: "glass" (Liquid Glass), "acrylic", "blur" or "none".
backdrop = "glass"
# Engine for "Search the web" results: "google", "bing", "duckduckgo", "kagi", "brave" or "custom".
search_engine = "google"
# Used when search_engine = "custom". %s is replaced by the search text, e.g.
# "https://search.example.com/?q=%s"
custom_search_url = ""

[launchpad]
# Which launcher each way of opening it shows: "sequoia" (full-screen Launchpad
# with pages and folders) or "tahoe" (Spotlight's Apps panel, sorted into categories).
dock = "sequoia"
spotlight = "tahoe"
# Optional global shortcut for Launchpad, like the Spotlight one ("" = none).
hotkey = ""
hotkey_opens = "sequoia"

[finder]
# Saved automatically when you change them in a Finder window.
view = "icons"          # "icons", "list", "columns" or "gallery"
sort = "name"           # "name", "modified", "created", "size" or "kind"
ascending = true
show_hidden = false
show_extensions = true
group = "none"          # "none", "name", "kind", "modified" or "size"
# List view columns after Name: "modified", "created", "size", "kind", "location".
columns = ["modified", "size", "kind"]
pane = "none"           # "none", "preview" or "details" (Alt+P / Alt+Shift+P)
icon_size = 64          # Icon view icon size in points (32 - 256; Ctrl+Plus / Ctrl+Minus)
# Folders added with "Add to Sidebar".
sidebar_pins = []
# Sidebar material: "glass" (Liquid Glass), "acrylic", "blur" or "none" (solid).
# All but "none" float the sidebar as a rounded pane, like macOS Tahoe; acrylic
# and blur need Transparency effects on.
sidebar = "glass"
# Win+E opens a Finder window instead of File Explorer (while DockSide runs).
replace_win_e = false

[desktops]
# Alt+1 ... Alt+9 switch to that virtual desktop (Windows' own desktops).
alt_number = true
# Win+Ctrl+Left / Right switch through DockSide instead, without Windows' popup.
replace_windows_switcher = true
# Show each switch in the Dynamic Island.
island = true

[island]
# A Dynamic Island at the top center of the screen. Click it for the time,
# your next event and quick timers; right-click for timers and settings; drop
# files on it to hold them on the shelf.
enabled = true
# Keep the small pill visible when nothing is happening.
always_show = true
# Expand an activity when the pointer rests on it (otherwise click).
expand_on_hover = true
# Milliseconds the pointer rests on the island before it expands.
hover_delay_ms = 350
# Milliseconds after the pointer leaves before an expanded island folds away
# (0 = at once).
collapse_delay_ms = 900
# "pill" floats a capsule; "notch" hangs from the top edge with a flat top and
# rounded bottom corners, and opens into squarer panels.
style = "pill"
# What the island is made of once it opens into a panel (folded, it's black):
# "black", "dynamic" (black at the top melting into Liquid Glass), "glass" or
# "frosted" (Windows' acrylic blur). With glass, like the Dock's, the island is
# left out of screenshots and recordings (the glass mustn't see itself).
finish = "black"
# Points to move the island down from its spot; negative moves it up.
vertical_offset = 0
# The display the island is on ("" = the main display; System Settings lists the others).
display = ""
# Seconds paused media stays in the island; 0 keeps it until the app closes.
hide_paused_after = 60

# Activities: these stay in the island while they're happening.
# Media playing in any app.
now_playing = true
# The line being sung, under the song in the Now Playing panel. Lyrics come
# from lrclib.net (free, no account): each song's title, artist and length are
# sent there once to look them up.
lyrics = true
# Timers and the stopwatch (the home panel's buttons and the right-click menu).
timers = true
# Browser downloads in progress.
downloads = true
# Upcoming meetings from the Windows calendar (Calendar / Outlook accounts).
calendar = true
# Minutes before a meeting that it appears in the island.
calendar_lead = 10
# Calendar links to subscribe to (.ics or webcal://), separated by spaces, e.g.
# Google Calendar's "Secret address in iCal format". Keep these private:
# anyone with the link can read your calendar.
calendar_ics = ""
# Show what Claude Code is doing, and when it finishes or needs you. Click
# "Connect Claude Code" in System Settings > Dynamic Island to add its hooks.
claude_code = true
# The Discord voice channel you're in, with buttons to mute, deafen and leave.
# Discord only lets apps it approves (or your own) control voice, so: create an
# application at https://discord.com/developers/applications, add
# http://localhost under OAuth2 > Redirects, paste its Client ID and Client
# Secret below, then click "Connect Discord" in System Settings > Dynamic
# Island and approve DockSide in Discord.
discord = true
discord_client_id = ""
discord_client_secret = ""
# Live Activities from other apps and scripts: progress, timers and status they
# send with `dockside activity start <id> --title ... --progress 40%` (see README).
live_activities = true
# Drag files to the top of the screen to hold them on a shelf, then drag them
# out where they're going. Nothing is copied: the shelf points at the files
# where they are, and dragging one out to the same drive moves it. Right-click
# one to convert it to another format.
shelf = true
# Empty the shelf each time DockSide starts.
shelf_clear_on_start = true
# Minutes a file stays on the shelf before it's taken off (0 = keep until you
# remove it). 60 = an hour, 1440 = a day, 10080 = a week. The file itself stays.
shelf_expire_minutes = 1440
# Quick Actions: tiles beside the shelf while you drag files over it. Drop on
# one instead of the shelf to convert the files (the results land on the
# shelf), copy the text in pictures, or zip them.
quick_convert = true
quick_text = true
quick_zip = true

# Alerts: brief pop-ups when something changes.
# Volume (media keys, or scroll over the island) and brightness, shown in the
# island instead of the Windows popup.
volume = true
brightness = true
charging = true
low_battery = true
caps_lock = true
do_not_disturb = true
# New Windows notifications as banners. Tip: turn off "Show notification
# banners" in Windows Settings to avoid seeing them twice.
notifications = true
# Bluetooth devices connecting, with their battery level.
bluetooth = true
# A green / orange dot while an app starts using the camera / microphone.
privacy_indicators = true
# New screenshots (Win+PrtScn, Snipping Tool).
screenshots = true
# A browser download finishing.
download_alerts = true
# (Virtual desktop switches: `island` under [desktops].)

[calendar]
# Calendar accounts are added in System Settings > Calendars (iCloud, Google,
# Outlook, any CalDAV server, or a subscribed .ics link). Their sign-ins are
# kept encrypted in calendars.dat next to this file, not here.
#
# Google and Microsoft only let registered apps sign in, so DockSide uses your
# own (free) app registration. Settings walks you through making one.
# Google Cloud: a "Desktop app" OAuth client, with the Google Calendar API on.
google_client_id = ""
google_client_secret = ""
# Microsoft Entra: an app registration with the redirect URI http://localhost
# (Mobile and desktop applications) and the Calendars.Read permission.
microsoft_client_id = ""
# The first day of the week in the menu bar calendar: "auto" (from Windows'
# region settings), "sunday" or "monday".
week_starts = "auto"

[widgets]
# Widgets on the desktop, below your windows. Drag them to move them (they snap
# to each other and the screen edges); right-click one to resize or remove it.
# Add more in System Settings > Widgets.
enabled = true
# "acrylic", "blur", "glass" (Liquid Glass) or "none" (solid)
backdrop = "acrylic"
# Weather location: a place ("London", "Paris, France"), coordinates
# ("51.5,-0.12"), or "" to find it from your network.
location = ""
# "auto" follows the Windows region (Fahrenheit for the US), or "c" / "f".
temperature_unit = "auto"
# World Clock time zones, "Area/City" or "Label=Area/City"
# (see https://en.wikipedia.org/wiki/List_of_tz_database_time_zones).
world_clocks = ["America/Los_Angeles", "America/New_York", "Europe/London", "Asia/Tokyo"]

# Widgets and where they sit (top-left corner, in points from the screen's top-left).
#   kind - clock, world_clock, weather, calendar, up_next, batteries, notes,
#          reminders, notifications, now_playing, music_wave, photo, video,
#          system or user
#   size - small, medium or large (not every widget has every size)
#   zone - world_clock: the time zone of a small one (optional)
#   display - the display it's on (optional; set by dragging it to another screen)
#   sensors - system: what it shows, in order (optional; right-click › Show to pick).
#             "cpu", "memory", "disk" (system drive), "disk:D", "network" (all),
#             "network:Wi-Fi" (by adapter name), and per GPU, by vendor-device id
#             or "gpu" for the first one: "gpu:10de-2504" (usage),
#             "gpu_memory:10de-2504" and "gpu_temp:10de-2504". The first CPU or
#             GPU usage gets a graph (medium; large graphs the first two).
#   path - photo: a picture, GIF or folder (a slideshow, 30 s a picture);
#          video: a video file (loops, muted). Right-click › Choose… to pick.
#   options - user: the extras it shows, from "greeting", "buttons" (Lock,
#             Sign Out, Sleep) and "device" (PC name and uptime); none = all.
[[widgets.items]]
kind = "clock"
size = "small"
x = 24
y = 48

[[widgets.items]]
kind = "calendar"
size = "small"
x = 218
y = 48

[[widgets.items]]
kind = "weather"
size = "medium"
x = 24
y = 242

[[widgets.items]]
kind = "batteries"
size = "small"
x = 24
y = 436

[[widgets.items]]
kind = "notes"
size = "small"
x = 218
y = 436

# Display names by exe file name (menu bar + Dock tooltips).
[app_names]
"explorer.exe" = "File Explorer"
"msedge.exe" = "Microsoft Edge"
"WindowsTerminal.exe" = "Terminal"
"Code.exe" = "Visual Studio Code"
