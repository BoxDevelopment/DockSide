# DockSide configuration.
# Changes apply as soon as you save this file. Delete it to restore defaults.

[general]
# "auto" follows the Windows app theme, or force "light" / "dark".
appearance = "auto"
# UI font. Install "SF Pro Text" (or "Inter") for the most faithful look;
# falls back to "Segoe UI Variable Text" when the font isn't installed.
font = "SF Pro Text"
# Highlight color for menus and selections.
accent = "#007AFF"
# Hide the Windows taskbar while DockSide runs (always restored on exit).
hide_taskbar = true
# "mac" shows ⌘C-style hints in menus (⌘ = Ctrl, ⌥ = Alt, ⌃ = Win),
# "windows" shows Ctrl+C.
shortcut_style = "mac"
# "glass" backgrounds (and the glass Finder sidebar) bend and magnify what's
# behind them like Apple's Liquid Glass. This captures the screen, so glass
# surfaces are hidden from screenshots and screen sharing; turn it off to keep
# a non-bending glass that shows up in captures.
glass_refraction = true
# Set once the Setup Assistant has been finished or skipped. Set it back to
# false to see it on the next launch (or open it from System Settings > General).
onboarding_done = false

[menubar]
enabled = true
# Bar height in points (22-40); text and icons scale with it.
height = 24
# "clear" (no bar, like macOS Tahoe: text sits on the wallpaper and turns
# light or dark to match it), "acrylic", "blur", "glass" (Liquid Glass) or "none"
backdrop = "clear"
tint_light = "#F4F4F4B0"
tint_dark = "#1C1C1EB0"
# "apple", "windows", or a path to a .png / .ico
logo = "apple"
# strftime syntax, see https://docs.rs/chrono/latest/chrono/format/strftime
clock_format = "%a %b %-d  %-I:%M %p"
show_battery = true
show_battery_percent = false
show_wifi = true
show_search = true
show_control_center = true
# Lists every app's tray icon (left click = click it, right click = its menu).
show_tray = true
# App name shown when the desktop has focus.
desktop_app_name = "Finder"
# Keep maximized windows from covering the menu bar.
reserve_space = true

[dock]
enabled = true
tile_size = 48
magnification = true
magnified_size = 80
# Gap between the Dock and the bottom of the screen (Settings: Vertical offset).
bottom_margin = 4
# Gap between Dock items, as a percentage of the icon size (Settings: Item spacing).
item_spacing = 8
backdrop = "acrylic"
tint_light = "#F6F6F680"
tint_dark = "#2A2A2C80"
# "native" draws Windows icons as-is; "squircle" puts them on a white macOS-style tile.
icon_style = "native"
# Show running apps that aren't pinned.
show_running = true
show_trash = true
# Slide the Dock off-screen until the pointer touches the bottom edge.
autohide = false
# With autohide, keep the Dock shown while the desktop is focused.
show_on_desktop = false
# Keep maximized windows from covering the Dock (ignored with autohide).
reserve_space = true

# Pinned apps, left to right.
#   path  - .exe, .lnk, folder, URI, "shell:AppsFolder\<AUMID>" for Store apps,
#           or "dockside:finder" for the built-in Finder
#   name  - tooltip label (optional)
#   args  - launch arguments (optional)
#   icon  - custom .png / .ico, e.g. a macOS-style icon (optional)
#   match - exe file name used to detect the running app (optional)
# Environment variables like %LOCALAPPDATA% are expanded.

[[dock.apps]]
name = "Finder"
path = "dockside:finder"

[[dock.apps]]
name = "Microsoft Edge"
path = "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe"

[[dock.apps]]
name = "Terminal"
path = "shell:AppsFolder\\Microsoft.WindowsTerminal_8wekyb3d8bbwe!App"
match = "WindowsTerminal.exe"

[[dock.apps]]
name = "Notepad"
path = "C:\\Windows\\System32\\notepad.exe"

[[dock.apps]]
name = "Calculator"
path = "shell:AppsFolder\\Microsoft.WindowsCalculator_8wekyb3d8bbwe!App"
match = "CalculatorApp.exe"

[[dock.apps]]
name = "System Settings"
path = "shell:AppsFolder\\windows.immersivecontrolpanel_cw5n1h2txyewy!microsoft.windows.immersivecontrolpanel"
match = "SystemSettings.exe"

[spotlight]
enabled = true
# Global shortcut: "alt+space", "ctrl+space" or "ctrl+alt+space" (any of ctrl/alt/shift/win + a key).
hotkey = "alt+space"
# Engine for "Search the web" results: "google", "bing", "duckduckgo", "kagi", "brave" or "custom".
search_engine = "google"
# Used when search_engine = "custom". %s is replaced by the search text, e.g.
# "https://search.example.com/?q=%s"
custom_search_url = ""

[finder]
# Saved automatically when you change them in a Finder window.
view = "icons"          # "icons", "list" or "columns"
sort = "name"           # "name", "modified", "size" or "kind"
ascending = true
show_hidden = false
# Sidebar material: "glass" (Liquid Glass), "acrylic", "blur" or "none" (solid).
# All but "none" float the sidebar as a rounded pane, like macOS Tahoe; acrylic
# and blur need Transparency effects on.
sidebar = "glass"

[desktops]
# Alt+1 ... Alt+9 switch to that virtual desktop (Windows' own desktops).
alt_number = true
# Win+Ctrl+Left / Right switch through DockSide instead, without Windows' popup.
replace_windows_switcher = true
# Show each switch in the Dynamic Island.
island = true

[island]
# A Dynamic Island at the top center of the screen. Click it for the time,
# your next event and quick timers; right-click for timers and settings; drop
# files on it to hold them on the shelf.
enabled = true
# Keep the small pill visible when nothing is happening.
always_show = true
# Expand an activity when the pointer rests on it (otherwise click).
expand_on_hover = false
# "pill" floats a capsule; "notch" hangs from the top edge with a flat top and
# rounded bottom corners, and opens into squarer panels.
style = "pill"
# Points to move the island down from its spot; negative moves it up.
vertical_offset = 0
# Seconds paused media stays in the island; 0 keeps it until the app closes.
hide_paused_after = 60

# Activities: these stay in the island while they're happening.
# Media playing in any app.
now_playing = true
# Timers and the stopwatch (the home panel's buttons and the right-click menu).
timers = true
# Browser downloads in progress.
downloads = true
# Upcoming meetings from the Windows calendar (Calendar / Outlook accounts).
calendar = true
# Minutes before a meeting that it appears in the island.
calendar_lead = 10
# Calendar links to subscribe to (.ics or webcal://), separated by spaces, e.g.
# Google Calendar's "Secret address in iCal format". Keep these private:
# anyone with the link can read your calendar.
calendar_ics = ""
# Show what Claude Code is doing, and when it finishes or needs you. Click
# "Connect Claude Code" in System Settings > Dynamic Island to add its hooks.
claude_code = true
# Drop files on the island to hold them on a shelf.
shelf = true

# Alerts: brief pop-ups when something changes.
# Volume (media keys, or scroll over the island) and brightness, shown in the
# island instead of the Windows popup.
volume = true
brightness = true
charging = true
low_battery = true
caps_lock = true
do_not_disturb = true
# New Windows notifications as banners. Tip: turn off "Show notification
# banners" in Windows Settings to avoid seeing them twice.
notifications = true
# Bluetooth devices connecting, with their battery level.
bluetooth = true
# A green / orange dot while an app starts using the camera / microphone.
privacy_indicators = true
# New screenshots (Win+PrtScn, Snipping Tool).
screenshots = true
# A browser download finishing.
download_alerts = true
# (Virtual desktop switches: `island` under [desktops].)

[widgets]
# Widgets on the desktop, below your windows. Drag them to move them (they snap
# to each other and the screen edges); right-click one to resize or remove it.
# Add more in System Settings > Widgets.
enabled = true
# "acrylic", "blur", "glass" (Liquid Glass) or "none" (solid)
backdrop = "acrylic"
# Weather location: a place ("London", "Paris, France"), coordinates
# ("51.5,-0.12"), or "" to find it from your network.
location = ""
# "auto" follows the Windows region (Fahrenheit for the US), or "c" / "f".
temperature_unit = "auto"
# World Clock time zones, "Area/City" or "Label=Area/City"
# (see https://en.wikipedia.org/wiki/List_of_tz_database_time_zones).
world_clocks = ["America/Los_Angeles", "America/New_York", "Europe/London", "Asia/Tokyo"]

# Widgets and where they sit (top-left corner, in points from the screen's top-left).
#   kind - clock, world_clock, weather, calendar, up_next, batteries, notes,
#          reminders, now_playing or system
#   size - small, medium or large (not every widget has every size)
#   zone - world_clock: the time zone of a small one (optional)
[[widgets.items]]
kind = "clock"
size = "small"
x = 24
y = 48

[[widgets.items]]
kind = "calendar"
size = "small"
x = 218
y = 48

[[widgets.items]]
kind = "weather"
size = "medium"
x = 24
y = 242

[[widgets.items]]
kind = "batteries"
size = "small"
x = 24
y = 436

[[widgets.items]]
kind = "notes"
size = "small"
x = 218
y = 436

# Display names by exe file name (menu bar + Dock tooltips).
[app_names]
"explorer.exe" = "Finder"
"msedge.exe" = "Microsoft Edge"
"WindowsTerminal.exe" = "Terminal"
"Code.exe" = "Visual Studio Code"
